<div class="hdr">

// ── Date helpers ──
function today(){var t=new Date();t.setHours(0,0,0,0);return t;}
function daysLeft(s){
  if(!s)return null;
  var iso=toISO(s);if(!iso)return null;
  var p=iso.split("-");if(p.length!==3)return null;
  return Math.round((new Date(+p[0],+p[1]-1,+p[2])-today())/864e5);
}
function tier(d){if(d===null)return"grn";if(d<=182)return"red";if(d<=365)return"yel";return"grn";}
function toISO(s){
  if(!s)return"";
  if(s.length===10&&s[4]==="-")return s;
  var p=s.split("/");
  if(p.length===3)return p[2]+"-"+(p[0].length<2?"0":"")+p[0]+"-"+(p[1].length<2?"0":"")+p[1];
  return s;
}
function fromISO(s){if(!s)return"";var p=s.split("-");if(p.length===3)return p[1]+"/"+p[2]+"/"+p[0];return s;}
function fmtDate(s){
  if(!s)return"-";var p=s.split("/");if(p.length!==3)return s;
  var mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return mn[+p[0]-1]+" "+(+p[1])+", "+p[2];
}
function fmtToday(){
  var t=new Date();
  var mn=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var dn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  return dn[t.getDay()]+", "+mn[t.getMonth()]+" "+t.getDate()+", "+t.getFullYear();
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── Call Apps Script for writes ──
async function callScript(payload){
  if(!SCRIPT_URL)throw new Error("Apps Script not configured");
  var r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(payload)});
  return await r.json();
}

function setSyncBar(type,msg){
  var b=document.getElementById("sync");
  b.textContent=msg;
  b.className=type==="ok"?"sync":type==="err"?"sync err":"sync warn";
}

function renderStats(){
  var c={red:0,yel:0,grn:0};
  DATA.forEach(function(l){c[tier(daysLeft(l.expiration))]++;});
  document.getElementById("stats").innerHTML=
    "<div class='card card-total'><div class='card-lbl'>Total Leases</div><div class='card-val'>"+DATA.length+"</div><div class='card-desc'>All properties</div></div>"+
    "<div class='card card-red'><div class='card-lbl'>Expiring Soon</div><div class='card-val'>"+c.red+"</div><div class='card-desc'>Under 6 months</div></div>"+
    "<div class='card card-yel'><div class='card-lbl'>Watch List</div><div class='card-val'>"+c.yel+"</div><div class='card-desc'>6-12 months</div></div>"+
    "<div class='card card-grn'><div class='card-lbl'>Good Standing</div><div class='card-val'>"+c.grn+"</div><div class='card-desc'>1+ year</div></div>";
}

function populateBuildings(){
  var seen={},sel=document.getElementById("fBuilding");
  while(sel.options.length>1)sel.remove(1);
  DATA.forEach(function(l){var a=(l.address||"").split(",")[0].trim();if(a&&!seen[a]){seen[a]=1;}});
  Object.keys(seen).sort().forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=k;sel.appendChild(o);});
}

function render(){
  var q=(document.getElementById("q").value||"").toLowerCase().trim();
  var fu=document.getElementById("fStatus").value;
  var fb=document.getElementById("fBuilding").value;
  var rows=DATA.filter(function(l){
    if(q){var h=((l.tenant||"")+" "+(l.address||"")+" "+(l.notes||"")).toLowerCase();if(h.indexOf(q)===-1)return false;}
    if(fu&&tier(daysLeft(l.expiration))!==fu)return false;
    if(fb&&(l.address||"").split(",")[0].trim()!==fb)return false;
    return true;
  });
  rows.sort(function(a,b){
    var va,vb;
    if(sCol==="expiration"||sCol==="days"){va=toISO(a.expiration)||"9999-99-99";vb=toISO(b.expiration)||"9999-99-99";}
    else{va=(a[sCol]||"").toLowerCase();vb=(b[sCol]||"").toLowerCase();}
    return va<vb?-sDir:va>vb?sDir:0;
  });
  var shown=rows.length,total=DATA.length;
  document.getElementById("cbar").innerHTML="Showing <strong>"+shown+"</strong> of <strong>"+total+"</strong> leases"+(shown<total?" - <span style='color:#c9a84c;font-weight:600'>"+(total-shown)+" hidden</span>":"");
  var tbody=document.getElementById("tbody");
  if(!rows.length){tbody.innerHTML="<tr><td colspan='5'><div class='empty'>No leases match your filters</div></td></tr>";return;}
  var out="";
  for(var i=0;i<rows.length;i++){
    var l=rows[i],d=daysLeft(l.expiration),t=tier(d);
    var est=l.source==="D"?"<span class='dest'>[est.]</span>":"";
    var pill;
    if(d===null)pill="<span style='color:#bbb'>No date</span>";
    else if(d<0)pill="<span class='pill pill-red'><span class='pill-n'>Expired</span></span>";
    else if(d===0)pill="<span class='pill pill-red'><span class='pill-n'>Today</span></span>";
    else pill="<span class='pill pill-"+t+"'><span class='pill-n'>"+d.toLocaleString()+"</span> <span class='pill-lbl'>days</span></span>";
    out+="<tr class='row-"+t+"'>";
    out+="<td><div class='tname'>"+esc(l.tenant)+est+"</div></td>";
    out+="<td><div class='taddr'>"+esc(l.address||"")+"</div></td>";
    out+="<td><div class='texp'>"+fmtDate(l.expiration)+"</div></td>";
    out+="<td>"+pill+"</td>";
    out+="<td><div class='acts'><button class='btn btn-sm btn-out' data-edit='"+esc(l.id)+"'>Edit</button> <button class='btn btn-sm btn-del' data-del='"+esc(l.id)+"'>X</button></div></td>";
    out+="</tr>";
  }
  tbody.innerHTML=out;
}

function initSort(){
  document.querySelectorAll("thead th[data-col]").forEach(function(th){
    th.addEventListener("click",function(){
      var col=this.getAttribute("data-col");
      document.querySelectorAll("thead th").forEach(function(h){h.classList.remove("sorted");});
      if(sCol===col){sDir*=-1;}else{sCol=col;sDir=1;}
      this.classList.add("sorted");render();
    });
  });
}

function openEdit(id){
  var l=id?DATA.find(function(x){return x.id===id;}):null;
  editId=id||null;
  document.getElementById("mTitle").textContent=id?"Edit Lease":"Add Lease";
  document.getElementById("mTenant").value=l?l.tenant:"";
  document.getElementById("mAddr").value=l?l.address||"":"";
  document.getElementById("mBldg").value=l?l.building||"":"";
  document.getElementById("mExp").value=l?toISO(l.expiration||""):"";
  document.getElementById("mSrc").value=l?l.source||"manual":"manual";
  document.getElementById("mNotes").value=l?l.notes||"":"";
  document.getElementById("ovlEdit").classList.add("open");
  setTimeout(function(){document.getElementById("mTenant").focus();},60);
}
function closeEdit(){document.getElementById("ovlEdit").classList.remove("open");editId=null;}

async function saveLease(){
  var tenant=document.getElementById("mTenant").value.trim();
  if(!tenant){toast("Tenant name required.");return;}
  var expISO=document.getElementById("mExp").value;
  var rec={
    id:editId||("l_"+Date.now()),
    tenant:tenant,
    address:document.getElementById("mAddr").value.trim(),
    building:document.getElementById("mBldg").value.trim(),
    expiration:expISO?fromISO(expISO):"",
    exp_sort:expISO?expISO.replace(/-/g,""):"99999999",
    source:document.getElementById("mSrc").value,
    notes:document.getElementById("mNotes").value.trim()
  };
  try{
    setSyncBar("warn","Saving...");
    if(editId){
      await callScript({action:"update",id:editId,data:rec});
    }else{
      await callScript({action:"add",data:rec});
    }
    closeEdit();await loadData();toast(editId?"Lease updated.":"Lease added.");
  }catch(e){toast("Error: "+e.message);setSyncBar("err","Save failed: "+e.message);}
}

function openDel(id){delId=id;document.getElementById("ovlDel").classList.add("open");}
function closeDel(){document.getElementById("ovlDel").classList.remove("open");delId=null;}
async function doDelete(){
  try{
    setSyncBar("warn","Deleting...");
    await callScript({action:"delete",id:delId});
    closeDel();await loadData();toast("Lease removed.");
  }catch(e){toast("Error: "+e.message);}
}

function doExportExcel(){
  var headers=["Tenant","Address","Expiration","Days Left","Status","Source","Notes"];
  var sorted=DATA.slice().sort(function(a,b){
    var va=toISO(a.expiration)||"9999",vb=toISO(b.expiration)||"9999";
    return va<vb?-1:va>vb?1:0;
  });
  var csvRows=[headers.join(",")];
  sorted.forEach(function(l){
    var d=daysLeft(l.expiration),t=tier(d);
    var st=d===null?"No Date":d<0?"EXPIRED":t==="red"?"EXPIRING SOON":t==="yel"?"Watch List":"Good Standing";
    var src=l.source==="E"?"Explicit":l.source==="D"?"Estimated":"Manual";
    var dstr=d===null?"":d<0?"EXPIRED":String(d);
    var cells=[l.tenant||"",l.address||"",l.expiration||"",dstr,st,src,l.notes||""];
    var escaped=cells.map(function(c){
      var s=String(c);
      if(s.indexOf(",")>-1||s.indexOf("\n")>-1){
        s='"'+s.split('"').join('""')+'"';
      }
      return s;
    });
    csvRows.push(escaped.join(","));
  });
  var csv=csvRows.join("\r\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="Comjem_Leases_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Excel file downloaded.");
}

function toast(msg){
  var e=document.getElementById("toast");e.textContent=msg;e.classList.add("show");
  clearTimeout(ttTimer);ttTimer=setTimeout(function(){e.classList.remove("show");},3400);
}
function scheduleRefresh(){
  var now=new Date(),ms=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)-now;
  setTimeout(function(){render();renderStats();document.getElementById("liveDate").textContent=fmtToday();scheduleRefresh();},ms+500);
}

document.addEventListener("DOMContentLoaded",function(){
  document.getElementById("liveDate").textContent=fmtToday();
  scheduleRefresh();
  loadData();
  setInterval(loadData,30000);
  initSort();
  document.getElementById("btnAdd").addEventListener("click",function(){openEdit(null);});
  document.getElementById("btnRefresh").addEventListener("click",loadData);
  document.getElementById("btnXlsx").addEventListener("click",doExportExcel);
  document.getElementById("q").addEventListener("input",render);
  document.getElementById("fStatus").addEventListener("change",render);
  document.getElementById("fBuilding").addEventListener("change",render);
  document.getElementById("btnClear").addEventListener("click",function(){
    document.getElementById("q").value="";
    document.getElementById("fStatus").selectedIndex=0;
    document.getElementById("fBuilding").selectedIndex=0;
    render();
  });
  document.getElementById("btnMCancel").addEventListener("click",closeEdit);
  document.getElementById("btnMSave").addEventListener("click",saveLease);
  document.getElementById("btnDelCancel").addEventListener("click",closeDel);
  document.getElementById("btnDelOk").addEventListener("click",doDelete);
  document.getElementById("ovlEdit").addEventListener("click",function(e){if(e.target===this)closeEdit();});
  document.getElementById("ovlDel").addEventListener("click",function(e){if(e.target===this)closeDel();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeEdit();closeDel();}});
  document.getElementById("tbody").addEventListener("click",function(e){
    var eb=e.target.closest("[data-edit]"),db=e.target.closest("[data-del]");
    if(eb)openEdit(eb.getAttribute("data-edit"));
    if(db)openDel(db.getAttribute("data-del"));
  });
});
